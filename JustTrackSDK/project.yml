name: JustTrackSDK

options:
  bundleIdPrefix: io.justtrack
  createIntermediateGroups: true
  defaultConfig: Debug
  indentWidth: 4
  tabWidth: 4
  usesTabs: true

settings:
  base:
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    CURRENT_PROJECT_VERSION: 800
    MARKETING_VERSION: 8.0.0
    VERSIONING_SYSTEM: apple-generic
    CLANG_ANALYZER_SECURITY_FLOATLOOPCOUNTER: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_RAND: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_STRCPY: YES
    CLANG_TIDY_MISC_REDUNDANT_EXPRESSION: YES
    CLANG_TIDY_BUGPRONE_REDUNDANT_BRANCH_CONDITION: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    debug:
      VALIDATE_PRODUCT: NO
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      GCC_PREPROCESSOR_DEFINITIONS: [DEBUG=1, ABC=2]
    release:
      VALIDATE_PRODUCT: YES
      SWIFT_OPTIMIZATION_LEVEL: -O
      GCC_PREPROCESSOR_DEFINITIONS: [ABC=1]

xcodeVersion: 15.0.1

targets:
  JustTrackSDK:
    type: framework
    platform: iOS
    deploymentTarget: 12.0
    supportedDestinations: [iOS]
    sources:
      - path: JustTrackSDK
        excludes: ["**/*.h"]
      - path: JustTrackSDK
        includes: ["**/*.h"]
        excludes: [
          JustTrackSDK.h,
          Utils/SignalHandlerComparator/SignalHandlerComparator.h
        ]
        headerVisibility: project
      - path: JustTrackSDK
        includes: [
          JustTrackSDK.h,
          Utils/SignalHandlerComparator/SignalHandlerComparator.h
        ]
        headerVisibility: public
    settings:
      base:
        CURRENT_PROJECT_VERSION: 800
        INFO_PLIST_FILE: JustTrackSDK/Info.plist
    resources:
      - PrivacyInfo.xcprivacy
    postCompileScripts:
      - script: ./scripts/swiftlint.sh
        name: SwiftLint
        basedOnDependencyAnalysis: false
      - script: ./scripts/swiftformat.sh lint
        name: SwiftFormat
        basedOnDependencyAnalysis: false

  JustTrackSDKTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 12.0
    supportedDestinations: [iOS]
    sources:
      - path: JustTrackSDKTests
      - path: TestApp/TestApp.storekit
        buildPhase: resources
    dependencies:
      - target: JustTrackSDK
    settings:
      base:
        INFO_PLIST_FILE: JustTrackSDKTests/Info.plist
    
  TestApp:
    type: application
    platform: iOS
    deploymentTarget: 15.0
    supportedDestinations: [iOS]
    sources: 
      - path: TestApp
        excludes: [Info.plist, carthage-project.yml, pods-project.yml, spm-project.yml, SdkBridge]
    resources:
      - path: TestApp/TestApp.storekit
    dependencies:
      - target: JustTrackSDK
    settings:
      base:
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        INFO_PLIST_FILE: TestApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.justtrack.app
        SWIFT_OBJC_BRIDGING_HEADER: TestApp/TestApp-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: 1

schemes:
  JustTrackSDK:
    build:
      targets:
        JustTrackSDK: all

  JustTrackSDKTests:
    build:
      targets:
        JustTrackSDKTests: all
    test:
      targets:
        - JustTrackSDKTests
      gatherCoverageData: true
      coverageTargets:
        - JustTrackSDK
  
  TestApp:
    build:
      targets:
        TestApp: all
    run:
      storeKitConfiguration: TestApp/TestApp.storekit
      targets:
        - TestApp
