name: TestPods

options:
  bundleIdPrefix: io.justtrack
  createIntermediateGroups: true
  defaultConfig: Release
  indentWidth: 4
  tabWidth: 4
  usesTabs: false

settings:
  base:
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    VERSIONING_SYSTEM: apple-generic
    CLANG_ANALYZER_SECURITY_FLOATLOOPCOUNTER: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_RAND: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_STRCPY: YES
    CLANG_TIDY_MISC_REDUNDANT_EXPRESSION: YES
    CLANG_TIDY_BUGPRONE_REDUNDANT_BRANCH_CONDITION: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    debug:
      VALIDATE_PRODUCT: NO
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      GCC_PREPROCESSOR_DEFINITIONS: [DEBUG=1, ABC=2]
    release:
      VALIDATE_PRODUCT: YES
      SWIFT_OPTIMIZATION_LEVEL: -O
      GCC_PREPROCESSOR_DEFINITIONS: [ABC=1]

xcodeVersion: 15.0.1

targets:  
  TestPods:
    type: application
    platform: iOS
    deploymentTarget: 15.0
    supportedDestinations: [iOS]
    sources: 
      - path: TestApp
        excludes: [Info.plist, generate.sh, carthage-project.yml, pods-project.yml, spm-project.yml]
    settings:
      base:
        INFO_PLIST_FILE: TestApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.justtrack.app
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        SWIFT_OBJC_BRIDGING_HEADER: TestApp/TestApp-Bridging-Header.h

schemes:  
  TestPods:
    options:
      defaultConfig: Release
    build:
      targets:
        TestPods: all
    run:
      config: Release
      targets:
        - TestPods
