name: JustTrackSDKGoogleOdmAdapter

options:
  bundleIdPrefix: io.justtrack
  createIntermediateGroups: true
  defaultConfig: Debug
  indentWidth: 4
  tabWidth: 4
  usesTabs: true

settings:
  base:
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    CURRENT_PROJECT_VERSION: 100
    MARKETING_VERSION: 1.0.0
    VERSIONING_SYSTEM: apple-generic
    CLANG_ANALYZER_SECURITY_FLOATLOOPCOUNTER: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_RAND: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_STRCPY: YES
    CLANG_TIDY_MISC_REDUNDANT_EXPRESSION: YES
    CLANG_TIDY_BUGPRONE_REDUNDANT_BRANCH_CONDITION: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    debug:
      VALIDATE_PRODUCT: NO
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      GCC_PREPROCESSOR_DEFINITIONS: [DEBUG=1]
    release:
      VALIDATE_PRODUCT: YES
      SWIFT_OPTIMIZATION_LEVEL: -O

xcodeVersion: 16.0.0

targets:
  JustTrackSDKGoogleOdmAdapter:
    type: framework
    platform: iOS
    deploymentTarget: 12.0
    supportedDestinations: [iOS]
    sources:
      - path: JustTrackSDKGoogleOdmAdapter
        includes: ["**/*.m", "**/*.h", "**/*.swift"]
    dependencies:
      - framework: ../Frameworks/JustTrackSDK.xcframework
    settings:
      base:
        CURRENT_PROJECT_VERSION: 100
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.justtrack.JustTrackSDKGoogleOdmAdapter
        PRODUCT_NAME: JustTrackSDKGoogleOdmAdapter

schemes:
  JustTrackSDKGoogleOdmAdapter:
    build:
      targets:
        JustTrackSDKGoogleOdmAdapter: all
